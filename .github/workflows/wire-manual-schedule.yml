name: Wire Manual Schedule Builder

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: "!contains(github.event.head_commit.message, 'Wire manual schedule builder')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire schedule navigation
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/dashboard/page.tsx')
          text = path.read_text()
          old = '<button className={tab===\'schedule\'?\'active\':\'\'} onClick={()=>setTab(\'schedule\')}>Build / Upload Schedule</button>'
          new = '<button className={tab===\'schedule\'?\'active\':\'\'} onClick={()=>location.href=\'/schedule\'}>Build / Upload Schedule</button>'
          if old not in text:
              raise SystemExit('Expected schedule navigation was not found')
          path.write_text(text.replace(old, new, 1))
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/dashboard/page.tsx
          git commit -m 'Wire manual schedule builder'
          git push
