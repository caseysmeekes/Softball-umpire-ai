name: Wire violation details
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    if: "!contains(github.event.head_commit.message, 'Wire violation details')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update dashboard
        run: |
          node <<'NODE'
          const fs=require('fs')
          const p='app/dashboard/page.tsx'
          let s=fs.readFileSync(p,'utf8')
          const imp="import ViolationDetails from '../components/ViolationDetails'\n"
          if(!s.includes(imp)) s=s.replace("import {umpireColour} from '../../lib/umpire-colours'\n", "import {umpireColour} from '../../lib/umpire-colours'\n"+imp)
          const old="<td className={v.some(x=>x.severity==='hard')?'bad':v.length?'warn':'good'}>{v.some(x=>x.severity==='hard')?'Rule violation':v.length?'Soft warning':'Valid'}</td>"
          const newer="<td><ViolationDetails umpireName={u.name} violations={v}/></td>"
          if(!s.includes(newer)) {
            if(!s.includes(old)) throw new Error('Workload status cell not found')
            s=s.replace(old,newer)
          }
          fs.writeFileSync(p,s)
          NODE
      - name: Commit dashboard change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Wire violation details"
          git push
